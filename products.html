<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Shop | The Style Sphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="header"><a class="logo" href="index.html">THE <span>STYLE</span> SPHERE</a><nav class="nav"><a href="index.html">HOME</a><a href="?category=Men">MEN</a><a href="?category=Women">WOMEN</a><a href="?category=Kids">KIDS</a><a href="?category=Accessories">ACCESSORIES</a></nav><div class="header-actions"><div class="search-box"><span>⌕</span><input id="globalSearch" placeholder="Search for products, brands and more"></div><a href="login.html" class="head-icon">♙<small>Profile</small></a><a href="wishlist.html" class="head-icon">♡<small>Wishlist <b id="wishCount">0</b></small></a><a href="cart.html" class="head-icon">🛍<small>Bag <b id="cartCount">0</b></small></a></div></header>
<main class="shop-page">
  <div class="breadcrumb">Home / Shop / <span id="crumb">All Products</span></div>
  <div class="shop-heading"><div><p class="eyebrow">THE STYLE SPHERE</p><h1 id="pageTitle">All Products</h1><p id="resultCount"></p></div><select id="sortSelect"><option value="recommended">Recommended</option><option value="new">What's New</option><option value="discount">Better Discount</option><option value="high">Price: High to Low</option><option value="low">Price: Low to High</option><option value="rating">Customer Rating</option></select></div>
  <div class="shop-layout">
    <aside class="filters">
      <div class="filter-head"><b>FILTERS</b><button id="clearFilters">CLEAR ALL</button></div>
      <div class="filter"><h4>Gender</h4><label><input type="checkbox" value="Women" class="catFilter"> Women</label><label><input type="checkbox" value="Men" class="catFilter"> Men</label><label><input type="checkbox" value="Kids" class="catFilter"> Kids</label><label><input type="checkbox" value="Accessories" class="catFilter"> Accessories</label></div>
      <div class="filter"><h4>Category</h4><label><input type="checkbox" value="Dresses" class="typeFilter"> Dresses</label><label><input type="checkbox" value="Tops" class="typeFilter"> Tops</label><label><input type="checkbox" value="Shirts" class="typeFilter"> Shirts</label><label><input type="checkbox" value="T-Shirts" class="typeFilter"> T-Shirts</label><label><input type="checkbox" value="Jeans" class="typeFilter"> Jeans</label><label><input type="checkbox" value="Shoes" class="typeFilter"> Shoes</label><label><input type="checkbox" value="Bags" class="typeFilter"> Bags</label></div>
      <div class="filter"><h4>Price</h4><label><input type="radio" name="price" value="0-999"> Under ₹999</label><label><input type="radio" name="price" value="1000-1999"> ₹1000 - ₹1999</label><label><input type="radio" name="price" value="2000-4999"> ₹2000 - ₹4999</label><label><input type="radio" name="price" value="5000-99999"> ₹5000+</label></div>
      <div class="filter"><h4>Discount</h4><label><input type="radio" name="discount" value="20"> 20% and above</label><label><input type="radio" name="discount" value="40"> 40% and above</label><label><input type="radio" name="discount" value="60"> 60% and above</label></div>
    </aside>
    <section><div id="productGrid" class="product-grid shop-grid"></div><div id="emptyState" class="empty hidden"><div>⌕</div><h2>No products found</h2><p>Try changing your filters or search.</p><button class="btn btn-dark" id="emptyClear">CLEAR FILTERS</button></div></section>
  </div>
</main>
<div id="toast" class="toast"></div><script src="products.js"></script><script src="app.js"></script><script src="shop.js"></script>
</body></html>
