<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout | The Style Sphere</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><header class="simple-header"><a class="logo" href="index.html">THE <span>STYLE</span> SPHERE</a><div class="secure">🔒 100% SECURE CHECKOUT</div></header>
<main class="checkout-page"><div class="checkout-steps"><span class="active">1 ADDRESS</span><span>2 PAYMENT</span><span>3 ORDER CONFIRMED</span></div><div class="checkout-layout"><form id="checkoutForm" class="address-card"><p class="eyebrow">DELIVERY DETAILS</p><h1>Add New Address</h1><div class="two-col"><label>Name<input required name="name" placeholder="Full name"></label><label>Mobile<input required name="mobile" pattern="[0-9]{10}" placeholder="10-digit mobile"></label></div><label>Address<input required name="address" placeholder="House / Flat / Street"></label><div class="two-col"><label>City<input required name="city" placeholder="City"></label><label>PIN Code<input required name="pin" pattern="[0-9]{6}" placeholder="6-digit PIN"></label></div><label>State<input required name="state" placeholder="State"></label><div class="payment-box"><h3>Payment Method</h3><label class="radio"><input type="radio" name="payment" value="cod" checked> Cash on Delivery</label><label class="radio"><input type="radio" name="payment" value="upi"> UPI / Online Payment (Demo)</label><label class="radio"><input type="radio" name="payment" value="card"> Credit / Debit Card (Demo)</label></div><button class="btn btn-dark full">PLACE ORDER →</button></form><aside id="checkoutSummary" class="summary-card"></aside></div></main><div id="toast" class="toast"></div><script src="products.js"></script><script src="app.js"></script><script src="checkout.js"></script></body></html>
